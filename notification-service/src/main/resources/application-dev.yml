# Local development: the notification database from docker/docker-compose.dev.yml (host port 5433).
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/notification}
    username: ${DB_USER:notification}
    password: ${DB_PASSWORD:notification}

# Show database and disk details on /actuator/health (dev only).
management:
  endpoint:
    health:
      show-details: always
