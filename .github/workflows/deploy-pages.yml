name: Deploy to GitHub Pages

# Deployments run only from the dedicated `deploy` branch.
# To publish: merge/push the changes you want live into `deploy`.
on:
  push:
    branches:
      - deploy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # No package-lock.json is committed yet, so use `npm install` rather than `npm ci`.
        run: npm install --no-audit --no-fund

      - name: Build
        # The site is served from https://<owner>.github.io/<repo>/, so the base href must be /<repo>/.
        run: npx nx build ballb-portal --configuration=production --base-href="/${{ github.event.repository.name }}/"

      - name: Add SPA fallback for deep links
        # GitHub Pages serves 404.html for unknown paths; making it a copy of index.html lets
        # Angular's router handle URLs like /ballb/semesters/10 on refresh or direct visit.
        run: cp dist/apps/ballb-portal/browser/index.html dist/apps/ballb-portal/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/apps/ballb-portal/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
