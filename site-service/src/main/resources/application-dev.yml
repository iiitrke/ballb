# Local development: the site database from docker/docker-compose.dev.yml (host port 5433).
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/site}
    username: ${DB_USER:site}
    password: ${DB_PASSWORD:site}

# Show database and disk details on /actuator/health (dev only).
management:
  endpoint:
    health:
      show-details: always
