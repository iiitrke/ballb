# Local development: the identity database from docker/docker-compose.dev.yml (host port 5433).
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/identity}
    username: ${DB_USER:identity}
    password: ${DB_PASSWORD:identity}

# Show database and disk details on /actuator/health (dev only).
management:
  endpoint:
    health:
      show-details: always
