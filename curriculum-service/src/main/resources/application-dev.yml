# Local development: the curriculum database from docker/docker-compose.dev.yml (host port 5433).
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/curriculum}
    username: ${DB_USER:curriculum}
    password: ${DB_PASSWORD:curriculum}

# Show database and disk details on /actuator/health (dev only).
management:
  endpoint:
    health:
      show-details: always
